name: CI

on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:

concurrency:
  # Cancel superseded runs on a pull request, but never on a branch: the run on
  # master is what the README badge reads and what records history.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # min: the lower bound declared in Project.toml (currently 1.10, which
        # is also the LTS). 1: the latest stable release. Both track upstream on
        # their own, so this list does not need editing when Julia moves on.
        version: ["min", "1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v3

      - name: Add the JuliaReliab registry
        # DEQuadrature lives here rather than in General (so does NMarkov itself).
        # Both adds are guarded: julia-actions/cache restores registries between
        # runs, and adding one that is already present is an error. General is
        # named explicitly because adding a registry by RegistrySpec on an empty
        # depot does not pull General in, and Distributions comes from there.
        run: |
          julia -e '
            using Pkg
            names = [r.name for r in Pkg.Registry.reachable_registries()]
            "General" in names || Pkg.Registry.add("General")
            "Registry" in names ||
                Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaReliab/Registry.git"))'

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1

      # julia-runtest already collects coverage (its `coverage` input defaults to
      # true), so only the report and the upload were missing. One job is enough.
      - name: Process coverage
        if: matrix.version == '1'
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage
        if: matrix.version == '1'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
